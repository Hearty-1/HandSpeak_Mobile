# This PC has ~8 GB RAM: keep Gradle well below that, or Windows swaps and
# kills the build daemon ("Gradle build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.parallel=false
android.useAndroidX=true
# Your project (D:) and pub cache (C:) are on different Windows drives.
# Kotlin's incremental compiler can't compute a relative path across drive
# letters and crashes the daemon ("this and base files have different roots").
# Disabling incremental Kotlin compilation avoids that crash. Builds are a
# bit slower but stable. Safe to remove if you move everything to one drive.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false